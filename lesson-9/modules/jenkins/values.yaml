controller:
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "2.516.3-jdk17"
    tagLabel: jdk17
    pullPolicy: Always
  admin:
    username: admin
    password: admin123
  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - github:latest

persistence:
  enabled: true
  storageClass: gp2
  size: 10Gi